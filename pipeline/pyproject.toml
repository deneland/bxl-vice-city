[project]
name = "pipeline"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "laspy[lazrs]>=2.7.0",
    "mapbox-vector-tile>=2.2.0",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyproj>=3.8.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 130
extend-exclude = ["poc"]

[tool.ruff.lint]
select = ["E9", "F", "B"]
ignore = ["B905"]   # zip() without strict=: the zipped sequences are built to match
